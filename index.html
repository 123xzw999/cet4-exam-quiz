<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四级真题刷题系统 · CET-4</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/ink.css">
</head>
<body class="logged-out">

<div class="aurora" aria-hidden="true"></div>

<!-- ==================== 登录页 ==================== -->
<section class="login" id="login">
  <div class="login-card">
    <div class="login-logo">CET<span>4</span></div>
    <h1>四级真题刷题系统</h1>
    <p class="login-sub">2020 — 2026 · 46 套真题 · 2530 题 · 逐题解析</p>
    <form id="loginForm" autocomplete="on">
      <label class="field">
        <span>用户名</span>
        <input id="loginUser" type="text" autocomplete="username" spellcheck="false">
      </label>
      <label class="field">
        <span>密码</span>
        <input id="loginPass" type="password" autocomplete="current-password">
      </label>
      <div class="login-err" id="loginErr" hidden></div>
      <button class="btn primary lg full" type="submit" id="loginBtn">立即登录</button>
    </form>
    <p class="login-tip">登录后进入 4 级刷题系统</p>
  </div>
</section>

<!-- ==================== 主站 ==================== -->
<div id="app" hidden>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand" id="brandHome">
      <div class="logo">CET<span>4</span></div>
      <div class="brand-txt">
        <h1>四级真题刷题系统</h1>
        <p id="brandSub">2020 — 2026 · 46 套真题</p>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-nav="home" class="on">首页 · 按年份</button>
      <button data-nav="practice">刷题</button>
      <button data-nav="wrong">错题本 <b id="wrongBadge">0</b></button>
      <button data-nav="fav">收藏 <b id="favBadge">0</b></button>
    </nav>
    <div class="topstats" id="topstats"></div>
    <button class="btn sm ghost" id="logoutBtn" title="退出登录">退出</button>
  </div>
</header>

<main id="view">
  <div class="loading">正在载入题库，请稍候…</div>
</main>

</div><!-- /#app -->

<!-- ==================== 答题卡抽屉 ==================== -->
<div class="drawer-mask" id="sheetMask" hidden></div>
<aside class="drawer" id="sheet" hidden>
  <div class="drawer-head">
    <strong>答题卡</strong>
    <div class="legend">
      <span><i class="dot ok"></i>答对</span>
      <span><i class="dot bad"></i>答错</span>
      <span><i class="dot none"></i>未答</span>
    </div>
    <button class="icon-btn" id="sheetClose">×</button>
  </div>
  <div class="drawer-body" id="sheetBody"></div>
  <div class="drawer-foot" id="sheetFoot"></div>
</aside>

<!-- ==================== 透明模块（手写层） ==================== -->
<canvas id="inkCanvas" class="ink-canvas" hidden></canvas>
<div class="ink-frame" id="inkFrame" hidden><span>透明模块 · 手写模式</span></div>
<div class="ink-dock" id="inkDock">
  <button class="ink-toggle" id="inkToggle" title="开启/关闭透明模块（快捷键 D）">
    <svg viewBox="0 0 24 24"><path d="M4 20h4l10-10-4-4L4 16v4z"/><path d="M14 6l4 4"/></svg>
    <span>透明模块</span>
  </button>
  <div class="ink-tools" id="inkTools" hidden>
    <button class="sw on" data-color="#e5487f" style="--c:#e5487f"></button>
    <button class="sw" data-color="#1f6feb" style="--c:#1f6feb"></button>
    <button class="sw" data-color="#111418" style="--c:#111418"></button>
    <button class="sw" data-color="#12a150" style="--c:#12a150"></button>
    <button class="sw hl" data-color="#ffe14d" style="--c:#ffe14d"></button>
    <span class="sep"></span>
    <button class="tool" data-size="2">细</button>
    <button class="tool on" data-size="4">中</button>
    <button class="tool" data-size="9">粗</button>
    <span class="sep"></span>
    <button class="tool" id="inkEraser">橡皮</button>
    <button class="tool" id="inkUndo">撤销</button>
    <button class="tool" id="inkClear">清空</button>
    <button class="tool" id="inkSave">存图</button>
    <button class="tool" id="inkPass" title="开启后点击可穿透到页面">穿透</button>
  </div>
</div>

<script src="data/index.js"></script>
<script src="data/audio.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script src="js/ink.js"></script>
</body>
</html>
